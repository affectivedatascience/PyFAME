site_name: PyFAME
site_url: https://affectivedatascience.github.io/PyFAME/
repo_name: AffectiveDataScience/PyFAME
repo_url: https://github.com/affectivedatascience/PyFAME
edit_uri: tree/master/docs/
repo_name: affectivedatascience/PyFAME

theme:
  name: material
  logo: assets/pyfame_logo.png
  features:
    - navigation.indexes       # allows section index pages (important for API nav)
    - navigation.tabs          # top-level sections as tabs
    - navigation.tabs.sticky   # tabs stay visible on scroll
    - navigation.top           # back-to-top button
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
 
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: numpy
            heading_level: 2
            show_root_heading: false
            show_root_toc_entry: false
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            parameter_headings: false
            summary: false
 
nav:
  - Home: index.md
  - Getting Started: 
    - getting-started/index.md
    - Examples: examples/index.md
    - What is PyFAME?: getting-started/about-pyfame.md
    - Contributing: getting-started/contrib.md
    - Testing: getting-started/test.md
  - Reference:
    - reference/index.md
    - File Access: reference/file_access.md
    - Timing: reference/timing.md
    - Landmark: reference/landmark.md
    - Layer: 
      - reference/layer/index.md
      - Colour: reference/layer/colour.md
      - Masking: reference/layer/mask.md
      - Occlusion: reference/layer/occlusion.md
      - Overlay: reference/layer/overlay.md
      - Spatial: reference/layer/spatial.md
      - Stylise: reference/layer/stylise.md
    - Utilities: reference/utils.md
    - Logging: reference/logging.md
    - Analyse: reference/analyse.md
  - About Us:
    - about/index.md
    - Changelog: about/changelog.md
    - Affective Data Science Lab: https://affectivedatascience.com/
 
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css